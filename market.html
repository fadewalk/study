<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Study · 私密访问</title>
<style>
  :root{--bg:#f2f8fd;--card:#fff;--ink:#0f2436;--muted:#5b7186;--accent:#0284c7;--accent-soft:#e3f2fc;--deep:#075985;--border:#d8e6f2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--accent-soft));min-height:100vh;
    display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:15px}
  .login{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:38px 40px;width:360px;
    box-shadow:0 8px 30px rgba(10,60,110,.12)}
  .ico{font-size:30px;text-align:center}
  h1{font-size:18px;text-align:center;margin:10px 0 4px;color:var(--deep)}
  p.tip{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:20px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
  input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-size:14px;
    background:var(--accent-soft);color:var(--ink);outline:none}
  input:focus{border-color:var(--accent)}
  button{width:100%;margin-top:20px;padding:11px;border:none;border-radius:9px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  .err{color:#b91c1c;font-size:12.5px;text-align:center;margin-top:12px;min-height:18px}
  .ok{color:#047857;font-size:12.5px;text-align:center;margin-top:12px;min-height:18px}
  @media(max-width:480px){
    .login{width:min(360px,92vw);padding:26px 20px}
    h1{font-size:16px}
  }
</style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("study_theme")||"light"}catch(e){}</script>

const FILE = "market.html";
const ITER = 150000;
async function deriveKey(pass, saltB64) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: Uint8Array.from(atob(saltB64), c => c.charCodeAt(0)),
      iterations: ITER, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
// 解密：WebCrypto 要求 GCM tag 附在密文尾部，Node 侧是分开存的，这里先拼接
async function decryptFull(pass) {
  const key = await deriveKey(pass, BLOB.salt);
  const ct = Uint8Array.from(atob(BLOB.ct), c => c.charCodeAt(0));
  const tag = Uint8Array.from(atob(BLOB.tag), c => c.charCodeAt(0));
  const joined = new Uint8Array(ct.length + tag.length);
  joined.set(ct); joined.set(tag, ct.length);
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: Uint8Array.from(atob(BLOB.iv), c => c.charCodeAt(0)), tagLength: 128 },
    key, joined);
  return new TextDecoder().decode(plain);
}
function adoptScript(old) {
  const s = document.createElement('script');
  for (const a of old.attributes) s.setAttribute(a.name, a.value);
  s.text = old.textContent;
  return s;
}
// 用 DOMParser + 节点替换渲染（不用 document.write——它在已加载文档上会破坏视口滚动）
// 先换 body（内联脚本在插入时按序执行），再换 head（样式/外链/主题脚本）
function render(html, pass) {
  try { sessionStorage.setItem('study_pwd', pass); } catch (e) {}
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const dt = doc.documentElement.getAttribute('data-theme');
  if (dt) document.documentElement.setAttribute('data-theme', dt);
  document.title = doc.title;
  const bodyFrag = document.createDocumentFragment();
  for (const n of [...doc.body.children]) {
    bodyFrag.appendChild(n.tagName === 'SCRIPT' ? adoptScript(n) : document.adoptNode(n));
  }
  document.body.replaceChildren(bodyFrag);
  const headFrag = document.createDocumentFragment();
  for (const n of [...doc.head.children]) {
    headFrag.appendChild(n.tagName === 'SCRIPT' ? adoptScript(n) : document.adoptNode(n));
  }
  document.head.replaceChildren(headFrag);
}
async function tryUnlock(u, p, silent) {
  const err = document.getElementById('err');
  if (u !== "admin") { if (!silent) err.textContent = '账号或密码不正确'; return false; }
  try {
    const html = await decryptFull(p);
    render(html, p);
    return true;
  } catch (e) { if (!silent) err.textContent = '账号或密码不正确'; return false; }
}
const go = document.getElementById('go');
go.onclick = () => tryUnlock(document.getElementById('u').value.trim(), document.getElementById('p').value, false);
document.getElementById('p').addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); });
(async () => {
  try {
    const saved = sessionStorage.getItem('study_pwd');
    if (saved && await tryUnlock("admin", saved, true)) {
      document.getElementById('okmsg').textContent = '已自动解锁…';
    }
  } catch (e) {}
})();
